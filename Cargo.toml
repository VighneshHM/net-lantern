[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = "1"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.8"
hex = "0.4"
rust-embed = "8"
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
webbrowser = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
windows = "0.62.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }

# test-only dependencies
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
rustls = { version = "0.23", default-features = false }
tokio-tungstenite = "0.26"
tempfile = "3"
