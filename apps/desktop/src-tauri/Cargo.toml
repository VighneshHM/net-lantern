[package]
name = "netlantern-desktop"
version = "0.1.0"
edition = "2021"
publish = false

# Keeps this crate out of the root workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time"] }
tracing = "0.1"
netlantern = { path = "../../../crates/netlantern" }
netlantern-server = { path = "../../../crates/netlantern-server" }
netlantern-core = { path = "../../../crates/netlantern-core" }
netlantern-platform = { path = "../../../crates/netlantern-platform" }
tauri-plugin-notification = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
serde_json = "1"
