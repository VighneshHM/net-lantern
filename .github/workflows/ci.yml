name: CI

on:
  # Pushes to main, plus pull requests: a PR branch is checked once, not
  # once for the push and again for the PR.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The UI goes first: cargo embeds ui/dist into netlantern.exe.
      - name: UI install
        working-directory: ui
        run: npm ci
      - name: UI lint
        working-directory: ui
        run: npm run lint
      - name: UI unit tests
        working-directory: ui
        run: npm test
      - name: UI build
        working-directory: ui
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: cargo build
        run: cargo build -p netlantern

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: End-to-end demo test
        working-directory: ui
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore
