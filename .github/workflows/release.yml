name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The default token is read-only; only the release job below can write.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Work out the tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(cargo run -q -p xtask -- version)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # First real step: a tag that disagrees with the crate versions fails fast.
      - name: Check the tag matches the version
        run: cargo run -q -p xtask -- check-version "$TAG"

      - name: UI install
        working-directory: ui
        run: npm ci
      - name: UI lint
        working-directory: ui
        run: npm run lint
      - name: UI unit tests
        working-directory: ui
        run: npm test
      - name: UI build
        working-directory: ui
        run: npm run build

      - name: cargo test
        run: cargo test --workspace
      - name: Build the standalone exe
        run: cargo build --release -p netlantern

      - name: Desktop install
        working-directory: apps/desktop
        run: npm ci
      - name: Build the installer
        working-directory: apps/desktop
        run: npm run tauri -- build

      - name: Collect release assets
        run: |
          set -euo pipefail
          rm -rf release
          mkdir release
          shopt -s nullglob
          setups=(apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#setups[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one setup exe, found ${#setups[@]}"
            exit 1
          fi
          size=$(wc -c < "${setups[0]}" | tr -d ' ')
          if [ "$size" -ge 15000000 ]; then
            echo "::error::The setup exe is $size bytes, which is not under the 15,000,000 byte limit"
            exit 1
          fi
          cp "${setups[0]}" "release/NetLantern-${VERSION}-setup.exe"
          cp target/release/netlantern.exe "release/netlantern-${VERSION}-x64.exe"
          (cd release && sha256sum *.exe > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Write the release notes
        run: |
          set -euo pipefail
          {
            cargo run -q -p xtask -- release-notes "$VERSION"
            echo
            # __VERSION__ in the footer is the version placeholder.
            sed "s/__VERSION__/${VERSION}/g" .github/release-notes-footer.md
          } > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release
          path: release/
          if-no-files-found: ignore

      # Tag pushes only, and always a draft: publishing is a manual step.
      - name: Draft the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "Net Lantern ${VERSION}" \
            --notes-file notes.md \
            release/*
