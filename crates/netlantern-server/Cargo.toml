[package]
name = "netlantern-server"
version.workspace = true
edition.workspace = true

[dependencies]
netlantern-core = { path = "../netlantern-core" }
netlantern-platform = { path = "../netlantern-platform" }
axum.workspace = true
hex.workspace = true
mime_guess.workspace = true
rand.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "net"] }

[dev-dependencies]
async-trait.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json", "cookies"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tokio-tungstenite.workspace = true
tower = { workspace = true, features = ["util"] }
